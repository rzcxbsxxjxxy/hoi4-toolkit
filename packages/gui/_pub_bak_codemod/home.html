<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOI4 工作台</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* ══════════════════════════════════════════════════════════════
   * 工作台主页
   *
   * 改了什么、为什么:
   *  ① 顶栏与其余页面共用 nav.js(早期主页自带一套导航 + iframe,层级混乱)。
   *  ② 教程内容全在 docs.html,主页不再重复,只留一个入口。
   *  ③ ★★ 文案瘦身(用户反馈"文字量有点大"):
   *     旧版每张卡片有 desc + when 两段中文,加上 Hero 段、三步说明、
   *     页脚说明,一屏下来全是字,卡片本身的标题反而被淹没。
   *     现在版面上只保留:
   *       - 卡片:标题 + 一行 ≤14 字的短描述
   *       - 三步:标题 + 一个动作短语
   *     详细说明(何时用 / 展开细节)全部收进 data-tip,
   *     由 .tip 伪元素在鼠标悬停时浮出 —— 主动去 hover 的人才需要看。
   *  ④ 悬停浮层加了 220ms 延迟与移出即隐,避免划过时闪一片。
   * ══════════════════════════════════════════════════════════════ */

  main{ display:block; overflow:auto }
  .wrap{ max-width:1240px; margin:0 auto; padding:20px 28px 44px }

  /* ── 工程条(MAKE_MOD_V1)──
   * 旧版顶部是 Hero 大标题 —— 好看但零信息,而且和顶栏的"工作台"重复。
   * 换成"我现在在给谁做内容":一眼看到目标模组,没有就给新建入口。 */
  .projbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 13px;margin-bottom:18px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  }
  .projbar .lb{font-size:11px;color:var(--ink3);flex:none}
  .projbar .nm{
    font-size:13px;font-weight:650;color:var(--accent);
    max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .projbar .nm.none{color:var(--danger)}
  .projbar .pa{
    font-size:10.5px;color:var(--ink3);font-family:Consolas,monospace;
    max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .projbar .cnt{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);flex:none}
  .projbar .cnt b{color:var(--ink2);font-weight:600}
  .projbar button{
    font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);color:var(--ink2);cursor:pointer;
  }
  .projbar button:hover{background:var(--line2);color:var(--ink)}
  .projbar button.acc{background:var(--accent);border-color:var(--accent);color:#fff}
  .projbar button.acc:hover{filter:brightness(1.12);color:#fff}

  /* ── 制作主线 ──
   * 四步就是"做模组"的完整闭环。旧版"三步跑起来"讲的是怎么用工具,
   * 讲完用户还是不知道怎么做出一个模组 —— 这是"做不出模组"的直接原因。 */
  .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(226px,1fr));gap:10px}
  .fstep{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
    padding:11px 13px;text-decoration:none;color:inherit;position:relative;
    display:flex;align-items:center;gap:10px;
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .fstep:hover{transform:translateY(-2px);border-color:#b8cce2;box-shadow:0 6px 18px rgba(20,60,110,.13)}
  .fstep .n{
    width:21px;height:21px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:none;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;
  }
  .fstep .tx{flex:1;min-width:0}
  .fstep b{font-size:13px;display:block}
  .fstep s{
    text-decoration:none;color:var(--ink2);font-size:11.5px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .fstep .go{color:var(--accent);font-size:15px;flex:none;opacity:.55}
  .fstep:hover .go{opacity:1}
  .fstep.done .n{background:var(--ok-soft);color:var(--ok)}

  /* ── 统计条 ── */
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);
    overflow:hidden;margin-bottom:26px;
  }
  .stat{background:var(--panel);padding:11px 12px;text-align:center}
  .stat b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{font-size:11px;color:var(--ink3)}
  .stat u{
    display:block;text-decoration:none;font-size:10.5px;margin-top:3px;
    color:var(--accent);opacity:0;transition:opacity .12s;
  }
  .stat:hover{cursor:pointer}
  .stat:hover u{opacity:1}

  /* ── 分区 ── */
  .sect{margin-bottom:24px}
  .sect-h{
    display:flex;align-items:baseline;gap:9px;margin-bottom:10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .sect-h h2{margin:0;font-size:13.5px;font-weight:650}
  .sect-h .c{font-size:11px;color:var(--ink3)}
  .sect-h .more{margin-left:auto;font-size:11.5px;color:var(--accent);text-decoration:none}
  .sect-h .more:hover{text-decoration:underline}

  /* ── 卡片:标题 + 一行短描述 ── */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
    padding:12px 13px;text-decoration:none;color:inherit;position:relative;
    display:flex;flex-direction:column;gap:3px;
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:#b8cce2;box-shadow:0 6px 18px rgba(20,60,110,.13)}
  .card .top{display:flex;align-items:center;gap:9px}
  .card .cic{
    width:30px;height:30px;border-radius:8px;flex:none;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .card .cic svg{width:17px;height:17px}
  .card h3{margin:0;font-size:13.5px;font-weight:650}
  /* ★ 短描述:一行、 ellipsis。完整说明在悬停浮层里 */
  .card .desc{
    color:var(--ink2);font-size:12px;line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card.new{border-left:3px solid var(--ok)}
  /* ★ UI 精简:删掉了卡片底部那行 .path(/focus、/tech…)。
   * 它跟标题上方的链接目标重复,15 张卡就是 15 行纯噪音。 */

  /* ── 悬停浮层 ──
   * .tip / img.tex-fail 的通用实现已在 theme.css(全站共用一份),
   * 这里只写主页特有的:卡片内的文字排布。 */

  .foot{
    margin-top:26px;padding-top:12px;border-top:1px solid var(--line2);
    color:var(--ink3);font-size:11.5px;
  }
</style>
</head>
<body>

<header>
  <h1>工作台</h1>
  <span class="spacer"></span>
  <div id="nav"></div>
</header>

<main>
 <div class="wrap">

  <!-- 工程条:我现在在给谁做内容(没有可写模组时给出新建入口) -->
  <div class="projbar">
    <span class="lb">当前模组</span>
    <span class="nm" id="projName">…</span>
    <span class="pa" id="projPath"></span>
    <span class="cnt">
      <span id="projSrc"></span>
      <button id="projSwitch">切换</button>
      <button class="acc" id="projNew">＋ 新建模组</button>
    </span>
  </div>

  <!-- 模组开关:默认只展示基础游戏(vanilla),勾选的模组才进入索引与编辑范围(MOD_TOGGLE_V1) -->
  <div class="sect" id="modToggleSect">
    <div class="sect-h"><h2>模组开关</h2><span class="c">默认只展示基础游戏 · 勾选的模组才会进入索引与编辑范围</span></div>
    <div class="modtoggles" id="modToggles"><div class="empty">读取中…</div></div>
  </div>

  <!-- 制作主线:建工程 → 产出 → 落盘 → 校验 -->
  <div class="sect">
    <div class="sect-h"><h2>制作主线</h2><span class="c">做完这四步就有一个能加载的模组</span></div>
    <div class="flow">
      <a class="fstep tip" href="/open.html" id="fstep1" data-tip="没有模组就在这里「新建模组」:自动建 descriptor.mod + .mod + 12 个常用目录,并挂成可写来源。&#10;已有模组则「添加模组目录」挂进来。">
        <span class="n">1</span>
        <span class="tx"><b>建 / 挂模组</b><s>新建一个或挂载已有的</s></span>
        <span class="go">→</span>
      </a>
      <a class="fstep tip" href="/create.html" data-tip="表单化产出国策 / 事件 / 决议 / 科技 / 理念 / 装备,带本地化文件,生成时做可解析性自检。">
        <span class="n">2</span>
        <span class="tx"><b>产出内容</b><s>脚手架生成规范文件</s></span>
        <span class="go">→</span>
      </a>
      <a class="fstep tip" href="/ide.html" data-tip="「保存到模组」把上一步的产物直接写进目标模组(已存在的文件自动备份 .bak)。&#10;要手工改某个文件,在 IDE 里 Ctrl+E 编辑、Ctrl+S 保存。">
        <span class="n">3</span>
        <span class="tx"><b>落盘 / 手改</b><s>写入目标模组目录</s></span>
        <span class="go">→</span>
      </a>
      <a class="fstep tip" href="/check.html" data-tip="对挂载的来源跑校验:语法、括号、悬空引用、重复定义、缺失本地化。&#10;落盘后跑一遍,确认没引入新问题。">
        <span class="n">4</span>
        <span class="tx"><b>校验</b><s>体检 + 看可视化结果</s></span>
        <span class="go">→</span>
      </a>
    </div>
  </div>

  <!-- 概览数字:点击直达对应页面;拉取失败就保持 —,不阻塞渲染 -->
  <div class="stats" id="stats"></div>

  <!-- 内容可视化 -->
  <div class="sect">
    <div class="sect-h">
      <h2>内容可视化</h2><span class="c">读 common/ · 只读</span>
      <a class="more" href="/docs">上手教程 →</a>
    </div>
    <div class="cards" id="grpContent"></div>
  </div>

  <!-- 界面开发 -->
  <div class="sect">
    <div class="sect-h">
      <h2>界面开发</h2><span class="c">可写回源文件</span>
    </div>
    <div class="cards" id="grpUi"></div>
  </div>

  <!-- 文档与工程 -->
  <div class="sect">
    <div class="sect-h">
      <h2>文档与工程</h2>
    </div>
    <div class="cards" id="grpDoc"></div>
  </div>

  <div class="foot tip" data-tip="所有工具共享同一套 Clausewitz 解析器与 GUI 布局引擎，坐标 / 锚点计算在各界面工具间保持一致。&#10;官方手册与 common 文档实时读取，不做预生成快照 —— 改了文件刷新即可看到。">
    悬停任意卡片或本页底部可看详细说明
  </div>

 </div>
</main>

/* ── 工程条(MAKE_MOD_V1)──
 * "我现在在给谁做内容" —— 制作的第一步不是选工具,是确定写到哪儿。
 * 没有可写模组时整条主线是断的,这里直接把「新建模组」摆在最显眼处。 */
async function loadProject() {
  const nm = document.getElementById('projName');
  const pa = document.getElementById('projPath');
  const src = document.getElementById('projSrc');
  try {
    const j = await fetch('/api/sources').then((r) => r.json());
    const all = j.sources || [];
    const mods = all.filter((s) => !s.base);
    src.innerHTML = `已挂载 <b>${all.length}</b> 个来源(可写 ${mods.length})`;
    let want = null;
    try { want = JSON.parse(localStorage.getItem('gui.targetRoot') || 'null'); } catch (e) {}
    const cur = (want && mods.find((m) => m.i === want.i)) || mods[mods.length - 1] || null;
    if (!cur) {
      nm.textContent = '没有可写模组';
      nm.className = 'nm none';
      pa.textContent = j.readonly ? '当前是只读模式' : '到「打开 / 挂载」新建一个';
      document.getElementById('projSwitch').style.display = 'none';
    } else {
      nm.textContent = cur.name;
      nm.className = 'nm';
      pa.textContent = cur.path || '';
      pa.title = cur.path || '';
      nm.title = cur.path || '';
      try { localStorage.setItem('gui.targetRoot', JSON.stringify({ i: cur.i, name: cur.name })); } catch (e) {}
      if (mods.length > 1) {
        const sw = document.getElementById('projSwitch');
        sw.style.display = '';
        let k = mods.indexOf(cur);
        sw.onclick = () => {
          k = (k + 1) % mods.length;
          nm.textContent = mods[k].name;
          pa.textContent = mods[k].path || '';
          try { localStorage.setItem('gui.targetRoot', JSON.stringify({ i: mods[k].i, name: mods[k].name })); } catch (e) {}
        };
      }
    }
  } catch (e) {
    nm.textContent = '未能连接服务';
    nm.className = 'nm none';
  }
}
document.getElementById('projNew').onclick = () => { location.href = '/open.html' };
loadProject();

/* ── 概览数字 ──
 * ★ PERF_V2:旧实现并行拉 5 个内容图(决议一个就 3.2MB),只为填 6 个数字,
 *   打开工作台必卡几秒。现在走 /api/stats —— 后端只回计数,
 *   图没建好的先显示 —,后台建完再补一次(最多 6 次退避)。 */
const STATS = [
  { id: 'sGui', label: '.gui 文件', href: '/designer', key: 'gui' },
  { id: 'sFocus', label: '国策', href: '/focus', key: 'focus' },
  { id: 'sTech', label: '科技', href: '/tech', key: 'tech' },
  { id: 'sDoc', label: '学说', href: '/doctrines', key: 'doctrine' },
  { id: 'sDlc', label: 'DLC 条目', href: '/dlc', key: 'dlc' },
  { id: 'sFaction', label: '决议', href: '/decisions', key: 'decision' },
]
const sbox = document.getElementById('stats')
for (const s of STATS) {
  const d = document.createElement('div')
  d.className = 'stat'
  d.onclick = () => { location.href = s.href }
  d.innerHTML = `<b id="${s.id}">—</b><span>${s.label}</span><u>打开 →</u>`
  sbox.appendChild(d)
}
const fmt = (n) => (typeof n === 'number' ? n.toLocaleString('zh-CN') : '—')
const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.textContent = fmt(v) }

async function loadStats(attempt) {
  attempt = attempt || 0
  try {
    const j = await fetch('/api/stats').then((r) => r.json())
    for (const s of STATS) set(s.id, j[s.key])
    // 还有图在后台建 → 退避补一次,别一直刷
    if (j.pending && attempt < 6) {
      setTimeout(() => loadStats(attempt + 1), Math.min(600 * Math.pow(1.5, attempt), 5000))
    }
  } catch (e) { /* 拉不到就保持 —,不阻塞页面 */ }
}
loadStats()

<style>
.modtoggles{display:flex;flex-direction:column;gap:8px}
.modtg{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.modtg .mi{flex:1;min-width:0}
.modtg .mn{font-weight:600;font-size:13px}
.modtg .mp{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modtg .sw{position:relative;width:42px;height:22px;flex:none;cursor:pointer}
.modtg .sw input{opacity:0;width:0;height:0;position:absolute}
.modtg .sw .tk{position:absolute;inset:0;background:var(--line2);border-radius:20px;transition:.18s}
.modtg .sw .tk:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.18s}
.modtg .sw input:checked + .tk{background:var(--accent)}
.modtg .sw input:checked + .tk:before{transform:translateX(20px)}
.modtg.off{opacity:.62}
</style>
<script>
/* 模组开关:默认只展示基础游戏(vanilla),勾选的模组才进入索引与编辑范围。
 * 直接调 /api/mod/toggle 即时生效(后端会重建 ROOTS + 索引),无需回设置页保存。 */
(function () {
  const box = document.getElementById('modToggles')
  if (!box) return
  function toast(m, err) {
    const t = document.getElementById('toast')
    if (!t) return
    t.textContent = m
    t.className = 'on' + (err ? ' err' : '')
    setTimeout(() => (t.className = ''), 2800)
  }
  async function load() {
    try {
      const j = await fetch('/api/settings').then((r) => r.json())
      const mods = j.mods || []
      if (!mods.length) {
        box.innerHTML = '<div class="empty">尚未挂载任何模组 · 去「＋ 新建模组」或设置页添加</div>'
        return
      }
      box.innerHTML = ''
      mods.forEach((m) => {
        const row = document.createElement('div')
        row.className = 'modtg' + (m.enabled ? '' : ' off')
        const mi = document.createElement('div'); mi.className = 'mi'
        const nm = document.createElement('div'); nm.className = 'mn'; nm.textContent = m.name || m.path.split('/').pop()
        const mp = document.createElement('div'); mp.className = 'mp'; mp.textContent = m.path
        mi.appendChild(nm); mi.appendChild(mp)
        const sw = document.createElement('label'); sw.className = 'sw'
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!m.enabled
        const tk = document.createElement('span'); tk.className = 'tk'
        sw.appendChild(cb); sw.appendChild(tk)
        cb.onchange = async () => {
          const on = cb.checked
          try {
            const r = await fetch('/api/mod/toggle', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: m.path, enabled: on }),
            })
            const d = await r.json()
            if (!r.ok || d.error) {
              cb.checked = !on; row.classList.toggle('off', !on)
              toast('切换失败: ' + (d.error || r.status), true); return
            }
            row.classList.toggle('off', !on)
            toast(on ? ('已启用「' + nm.textContent + '」,正在重建索引…') : ('已关闭「' + nm.textContent + '」'))
          } catch (e) {
            cb.checked = !on; row.classList.toggle('off', !on)
            toast('切换失败: ' + e, true)
          }
        }
        row.appendChild(mi); row.appendChild(sw)
        box.appendChild(row)
      })
    } catch (e) {
      box.innerHTML = '<div class="empty">读取模组列表失败: ' + e + '</div>'
    }
  }
  load()
})()
</script>
