<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HOI4 决议树</title>
<link rel="stylesheet" href="/theme.css">
<style>
  :root{ --canvas:#e9ebef }
  #left{width:260px;border-right:1px solid var(--line)}
  #right{width:300px;border-left:1px solid var(--line)}
  #stage{flex:1;position:relative;overflow:auto;background:var(--canvas);min-width:0;padding:14px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;align-content:start}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:10px;
    cursor:pointer;display:flex;flex-direction:column;gap:6px;
    transition:border-color .12s,box-shadow .12s;
  }
  .card:hover{border-color:#aeb6c2;box-shadow:var(--shadow)}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  /* 模组来源的决议:左侧一条绿边,卡片墙里一眼能分开 */
  .card.frommod{border-left:3px solid var(--ok)}
  .card .ic{width:38px;height:38px;border-radius:6px;background:var(--line2);object-fit:contain;align-self:center}
  .card .nm{font-size:12px;font-weight:600;word-break:break-all;text-align:center;line-height:1.35}
  .card .mt{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
  .mini{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--line2);color:var(--ink2)}
  .mini.c{background:#e7f5ed;color:var(--ok)}
  .mini.d{background:#eaf1fb;color:var(--accent)}
  .mini.f{background:#f3ecfb;color:#7c5cbf}
  .mini.m{background:var(--ok-soft);color:var(--ok);font-weight:600}
  .mini.ovr{background:var(--warn-soft);color:var(--warn);font-weight:600}
  .mini.new{background:#eaf1fb;color:var(--accent);font-weight:600}
  .mini.x{background:var(--accent-soft);color:var(--accent);font-weight:600}
  /* ── 三级树:文件 → 决议类 ── */
  #catList{padding:4px}
  .fitem{
    display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;cursor:pointer;
    font-size:12px;user-select:none;border:1px solid transparent;
  }
  .fitem:hover{background:var(--line2)}
  .fitem.on{background:var(--accent-soft);border-color:var(--accent-soft)}
  .fitem .caret{width:12px;color:var(--ink3);flex:none;font-size:10px;text-align:center}
  .fitem .fic{width:16px;height:16px;flex:none;border-radius:4px;background:var(--line2);object-fit:contain}
  .fitem .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
  .fitem .tag{background:var(--line2);color:var(--ink2);font-size:10px;padding:0 6px;border-radius:9px}
  .fchildren{margin-left:16px;padding-left:8px;border-left:1px solid var(--line)}
  .fchildren.hide{display:none}
  .fchildren .item{padding:4px 6px 4px 4px}
  .fchildren .catid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ── 面包屑 ── */
  #crumb{display:flex;align-items:center;gap:6px;font-size:12px;padding:0 0 8px;min-height:18px}
  .crumb-file{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumb-file:hover{border-color:var(--accent);color:var(--accent)}
  .crumb-sep{color:var(--ink3)}
  .crumb-cat{color:var(--ink);font-weight:600;word-break:break-all}
  /* ── 决议类属性与出现条件 ── */
  .condc{background:var(--accent-soft);color:var(--accent);font-size:10px;padding:0 6px;border-radius:9px;font-weight:700}
  #catMeta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;
    padding:5px 9px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:6px;color:var(--ink2);
  }
  .catmeta-id{font-weight:700;color:var(--ink)}
  .catmeta-attrs{color:var(--ink3)}
  .catmeta-conds{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
  .catmeta-conds button.cond{
    border:1px solid var(--line);background:var(--line2);color:var(--ink2);
    border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;
  }
  .catmeta-conds button.cond:hover{border-color:var(--accent);color:var(--accent)}
  #insp .tagr{
    display:inline-block;margin:1px 3px 1px 0;padding:1px 7px;border-radius:9px;
    background:var(--line2);color:var(--ink2);font-size:11px;
  }
  /* 卡片墙顶部的统计 + 图例条 */
  #cardSum{
    color:var(--ink3);font-size:11px;padding:0 0 10px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  }
  #cardSum span{display:inline-flex;align-items:center;gap:4px}
  #cardSum i.mk{width:9px;height:9px;border-radius:2px;display:inline-block}
  /* 检查器:脚本块原文(available/allowed/visible/effect/complete_effect)原样展示游戏脚本 */
  .dbtn{margin:2px 0 8px;padding:4px 10px;font-size:12px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer}
  .dbtn:hover{border-color:var(--accent);color:var(--accent)}
  .sec-t{font-size:11px;color:var(--ink3);font-weight:600;margin:10px 0 4px;letter-spacing:.03em}
  #insp .kv.blk{flex-direction:column;align-items:stretch;gap:3px;margin:4px 0}
  #insp .kv.blk > b{width:auto;color:var(--ink3);font-size:11px;font-weight:600}
  #insp pre.raw{
    margin:0;padding:6px 8px;font:11px/1.5 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;color:var(--ink);
    background:var(--line2);border:1px solid var(--line);border-radius:7px;
    max-height:150px;overflow:auto;
  }
</style>
</head>
<body>
<header>
  <div id="nav"></div>
</header>
<div class="subbar">
  <h1>决议树 <small id="statChip">—</small></h1>
  <div class="tgroup">
    <input type="text" id="q" placeholder="搜索决议 / 分类">
    <!-- UI_SLIM_V1:下拉类折叠,搜索框常驻 -->
    <div class="tgroup" data-collapse>
    <select id="srcSel" title="按来源筛选决议"></select>
    <select id="catSel"><option value="">全部分类</option></select>
    </div>
  </div>
  <span class="spacer"></span>
  <span id="srcSum" style="font-weight:400;color:var(--ink3);font-size:11px"></span>
  <div id="langbar"></div>
</div>
<main>
  <aside id="left" data-sizer="left" data-sizer-def="280">
    <div class="sizer-bar" title="拖动调宽 · 双击复位 · 双击侧栏折叠"></div>
    <div class="pane-title">决议树 · 文件 → 决议类 <span class="spacer"></span><span id="catCount" style="font-weight:400"></span></div>
    <div class="pane-body" id="catList"></div>
  </aside>
  <div id="stage">
    <div id="crumb"></div>
    <div id="catMeta"></div>
    <div id="cardSum"></div>
    <div id="grid"></div>
  </div>
  <aside id="right" data-no-i18n data-sizer="right" data-sizer-def="320">
    <div class="sizer-bar" title="拖动调宽 · 双击复位 · 双击侧栏折叠"></div>
    <div class="pane-title">属性</div>
    <div class="pane-body">
      <div id="insp"><div style="color:var(--ink3);padding:6px 11px">点选一个决议</div></div>
    </div>
  </aside>
</main>
<div id="toast"></div>
<script src="/i18n.js"></script>
<script src="/i18n-dict.js"></script>
<script src="/progress.js"></script>
<script src="/loadgate.js"></script>
<script type="module">
  import { mountNav } from '/nav.js'
  mountNav('#nav')
</script>
<script src="/sizer.js"></script>
<script src="/toolbar.js"></script>
<script src="/locclient.js"></script>
<script src="/incr.js"></script>
<script src="/tex.js"></script>
<!-- ★ RIGHTCLICK_V2:全站右键菜单 + 快捷键接线。
     ⚠ 顺序有依赖:ctx.js 先(菜单本体),keymap.js 必须在 keys.js 之前
     (keys.js boot 时要读目录),ctxwire.js 最后(它只是接线骨架)。 -->
<script src="/ctx.js"></script>
<script src="/keymap.js"></script>
<script src="/keys.js"></script>
<script src="/ctxwire.js"></script>
<!-- OWNERSHIP_V1:统一归属徽标 -->
<script src="/ownchip.js"></script>
<script src="/decisions.js"></script>
<!-- ★ FULLSCREEN_V1:全站全屏。必须在 nav.js 之前?否 —— nav.js 轮询等它,
     放哪都行;统一放页面脚本区末尾,好维护。 -->
<script src="/fullscreen.js"></script>
</body>
</html>
