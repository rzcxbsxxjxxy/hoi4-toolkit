<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HOI4 人物角色</title>
<link rel="stylesheet" href="/theme.css">
<style>
  :root{ --canvas:#e9ebef }
  #left{width:236px;border-right:1px solid var(--line)}
  #right{width:320px;border-left:1px solid var(--line)}
  #stage{flex:1;position:relative;overflow:auto;background:var(--canvas);min-width:0;padding:14px}

  #sum{padding:0 0 10px;color:var(--ink3);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}

  /* ── 左栏:文件列表 ── */
  #fileList{padding:4px 0}
  .frow{
    padding:5px 10px;font-size:11.5px;display:flex;align-items:center;gap:7px;
    cursor:pointer;border-left:3px solid transparent;border-bottom:1px solid var(--line2);
  }
  .frow:hover{background:var(--line2)}
  .frow.hit{border-left-color:var(--accent);background:var(--accent-soft)}
  .frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono,Consolas)}
  .frow .ct{color:var(--ink3);font-size:10.5px;font-variant-numeric:tabular-nums}
  .frow .ow{flex:none}

  /* ── 中栏:人物卡片墙 ── */
  #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .char{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
    padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:border-color .12s,box-shadow .12s;
  }
  .char:hover{border-color:#aeb6c2;box-shadow:var(--shadow)}
  .char.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .char .av{width:72px;height:90px;border-radius:8px;background:var(--line2);object-fit:contain;flex:none}
  .char .av.ph{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:26px}
  .char .nm{font-size:11.5px;font-weight:650;text-align:center;word-break:break-all;line-height:1.3}
  .char .id{font-size:9.5px;color:var(--ink3);text-align:center;word-break:break-all;line-height:1.2}
  .char .roles{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
  .char .min{font-size:9.5px;padding:0 5px;border-radius:8px;background:var(--line2);color:var(--ink2);white-space:nowrap}
  .char .min.dlc{background:var(--warn-soft);color:var(--warn)}
  .char.modnew{box-shadow:inset 3px 0 0 var(--ok)}
  .char.ovr{box-shadow:inset 3px 0 0 var(--warn)}
  .empty{color:var(--ink3);padding:30px 0;text-align:center}

  /* ── 右栏:检查器 ── */
  #insp{padding:2px 11px 16px}
  #insp .her{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  #insp .her img.hero,#insp .hero.ph{width:96px;height:120px;border-radius:10px;background:var(--line2);object-fit:contain;flex:none}
  #insp .hero.ph{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:36px}
  #insp .her .nm{font-size:16px;font-weight:700;word-break:break-all}
  #insp .her .id{font-size:10.5px;color:var(--ink3);word-break:break-all;margin-top:2px;font-family:var(--mono,Consolas)}
  #insp .kv{display:flex;gap:6px;padding:1px 0;align-items:baseline}
  #insp .kv b{flex:none;width:74px;font-weight:600;color:var(--ink2)}
  #insp .kv span{word-break:break-all;flex:1;min-width:0}
  #insp h4{margin:11px 0 4px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line2);padding-bottom:3px}
  #insp .tagr{display:inline-block;margin:1px 3px 1px 0;padding:0 6px;border-radius:8px;background:var(--line2);color:var(--ink2);font-size:10.5px}
  #insp .tagr.dlc{background:var(--warn-soft);color:var(--warn)}
  #insp .inst{margin:5px 0;padding:7px 9px;border-radius:8px;background:var(--inset);border:1px solid var(--line)}
  #insp .inst .ih{display:flex;align-items:center;gap:6px;font-weight:650;font-size:12px}
  #insp .inst .ic{font-size:10px;color:var(--ink3);margin-top:3px;word-break:break-all}
  #insp .dlcsel{margin:4px 0 8px}
  #insp select{width:100%}
  /* ── 职务块 ── */
  #insp .role{margin:3px 0;padding:6px 8px;border-radius:8px;background:var(--inset);border:1px solid var(--line)}
  #insp .role .rh{font-weight:650;font-size:12px;display:flex;align-items:center;gap:6px}
  #insp .role .rk{color:var(--ink3);font-size:10px;font-family:var(--mono,Consolas)}
  #insp .role .rl{margin-left:auto;color:var(--ink3);font-size:9.5px;font-variant-numeric:tabular-nums}
  #insp .role .rf{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  /* ── 多画像切换 ── */
  #insp .shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  #insp .shot{width:44px;height:54px;border-radius:6px;background:var(--line2);object-fit:contain;border:1.5px solid transparent;cursor:pointer}
  #insp .shot.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent-soft)}
  #insp .shotcur{font-size:10px;color:var(--ink3)}
  #insp .instrole{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0;align-items:center}
</style>
</head>
<body>
<header>
  <div id="nav"></div>
</header>
<div class="subbar">
  <h1>人物角色 <small id="statChip">—</small></h1>
  <div class="tgroup">
    <input type="text" id="q" placeholder="搜索人名 / id">
    <div class="tgroup" data-collapse>
    <select id="srcSel" title="按来源筛选"><option value="">全部来源</option></select>
    </div>
  </div>
  <span class="spacer"></span>
  <span id="srcSum" style="font-weight:400;color:var(--ink3);font-size:11px"></span>
  <div id="langbar"></div>
</div>
<main>
  <aside id="left" data-sizer="left" data-sizer-def="300">
    <div class="sizer-bar" title="拖动调宽 · 双击复位 · 双击侧栏折叠"></div>
    <div class="pane-title">文件 <span class="spacer"></span><span id="fileCount" style="font-weight:400"></span></div>
    <div class="pane-body" id="fileList"></div>
  </aside>
  <div id="stage">
    <div id="sum"></div>
    <div id="cards"><div class="empty" style="padding:30px 0;color:var(--ink3)">加载中…</div></div>
  </div>
  <aside id="right" data-no-i18n data-sizer="right" data-sizer-def="340">
    <div class="sizer-bar" title="拖动调宽 · 双击复位 · 双击侧栏折叠"></div>
    <div class="pane-title">属性</div>
    <div class="pane-body">
      <div id="insp"><div style="color:var(--ink3);padding:6px 11px">点选一个人物</div></div>
    </div>
  </aside>
</main>
<div id="toast"></div>
<script src="/bundles/characters.bundle.js?v=mvjll3h6"></script>
<script src="/i18n-dict.js"></script>


<script type="module">
  import { mountNav } from '/nav.js'
  mountNav('#nav')
</script>













</body>
</html>
